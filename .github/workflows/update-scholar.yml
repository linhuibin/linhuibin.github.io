name: Update Google Scholar citations

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. These run at about 00:23, 08:23, and 16:23 China Standard Time.
    - cron: "23 0,8,16 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test Scholar updater
        run: node --test .github/scripts/update-scholar.test.mjs
      - name: Check Google Scholar through SerpApi
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          for attempt in 1 2; do
            if node .github/scripts/update-scholar.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "Scholar update failed after two attempts."
              exit 1
            fi
            echo "Scholar update failed. Retrying in 5 minutes..."
            sleep 300
          done
      - name: Publish changed citation data
        run: |
          if git diff --quiet -- scholar.json index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholar.json index.html
          git commit -m "Update Google Scholar citations"
          git push
