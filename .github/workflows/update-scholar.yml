name: Update Google Scholar citations

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test Scholar updater
        run: node --test .github/scripts/update-scholar.test.mjs
      - name: Check Google Scholar through SerpApi
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: node .github/scripts/update-scholar.mjs
      - name: Publish a changed citation count
        run: |
          if git diff --quiet -- scholar.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholar.json
          git commit -m "Update Google Scholar citations"
          git push
